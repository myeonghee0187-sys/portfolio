<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover: iPhone 노치 영역까지 Intro 영상이 채워지고, env(safe-area-inset-*)가 값을 갖도록 유지한다.
      (전달된 meta-tags.html의 viewport 값에 이 항목만 더했다.)
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- 기본 SEO -->
    <title>Song Myeonghee</title>
    <meta name="description" content="송명희 웹디자이너 포트폴리오. UX/UI 디자인, 반응형 웹, 프론트엔드 구현과 AI를 활용한 프로젝트 및 작업 과정을 소개합니다." />
    <meta name="keywords" content="송명희, 웹디자이너, 웹디자인, UXUI, UIUX, 포트폴리오, 반응형 웹, 프론트엔드, Figma, React, AI 디자인, 생성형 AI" />
    <meta name="author" content="송명희" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://portfolio-two-virid-30.vercel.app/" />
    <meta name="theme-color" content="#D4E5EF" />

    <!-- 파비콘 세트 (public/favicon) -->
    <link rel="icon" href="/favicon/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon/icon-512.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Open Graph (카카오톡 / 페이스북 등 공유 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Song Myeonghee" />
    <meta property="og:title" content="Song Myeonghee" />
    <meta property="og:description" content="송명희 웹디자이너 포트폴리오. UX/UI 디자인, 반응형 웹, 프론트엔드 구현과 AI를 활용한 프로젝트 및 작업 과정을 소개합니다." />
    <meta property="og:url" content="https://portfolio-two-virid-30.vercel.app/" />
    <meta property="og:image" content="https://portfolio-two-virid-30.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter(X) card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Song Myeonghee" />
    <meta name="twitter:description" content="송명희 웹디자이너 포트폴리오. UX/UI 디자인, 반응형 웹, 프론트엔드 구현과 AI를 활용한 프로젝트 및 작업 과정을 소개합니다." />
    <meta name="twitter:image" content="https://portfolio-two-virid-30.vercel.app/og-image.png" />

    <!--
      Figma 지정 서체.
        Anton         - Hero 대형 타이포 / About 카드 heading
        Inter         - 본문 (About Watch 타이틀이 ExtraBold 800을 쓴다)
        IBM Plex Sans - Watch 시간 (Hero 500 / About 400)
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500&family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- SUIT - About 카드 본문(국문). Google Fonts에 없어 제작사 배포 CDN을 쓴다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css"
      rel="stylesheet"
    />
    <style>
      /* 번들이 로드되기 전 흰 화면이 보이지 않도록 가장 먼저 배경을 깐다. */
      html,
      body,
      #root {
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
